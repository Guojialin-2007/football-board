<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赛前盘口看板</title>
<style>
:root{
  --bg:#0b0f14; --panel:#121821; --panel2:#18202b; --line:#243041; --text:#e6edf3; --muted:#8b98a8; --faint:#5d6b7c;
  --up:#ff7a59; --down:#3fb7ff; --home:#f5b942; --away:#9b8cff; --good:#38d39f; --warn:#ffcc4d;
  --radius:14px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#f0f3f7; --line:#dde3ea; --text:#17202b; --muted:#5b6878; --faint:#8a96a5;
    --up:#e2552f; --down:#1688d6; --home:#c98a0c; --away:#6b58e0; --good:#0f9d6e; --warn:#b98400;
  }
}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:14px;padding:14px 0 10px;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.5px}
h1 span{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.stats{display:flex;gap:16px;margin-left:auto;color:var(--muted);font-size:13px;flex-wrap:wrap}
.stats b{color:var(--text);font-size:15px;margin-right:3px}
.bar{display:flex;gap:8px;padding-bottom:12px;flex-wrap:wrap}
.bar input,.bar select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit}
.bar input{flex:1;min-width:160px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer;user-select:none;font-size:14px}
.chip.on{color:var(--text);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--panel))}
main{padding:16px 0 60px}
.day{color:var(--muted);font-size:14px;font-weight:600;margin:18px 2px 8px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.card.hot{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;gap:8px}
.meta .lg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tm{font-weight:650;font-size:17px;line-height:1.3}
.tm.a{text-align:right}
.vs{color:var(--faint);font-size:13px}
.form{display:flex;gap:3px;margin-top:3px}
.tm.a .form{justify-content:flex-end}
.f{width:16px;height:16px;border-radius:4px;font-size:10px;display:grid;place-items:center;font-weight:700;color:#0b0f14}
.f.W{background:var(--good)}.f.D{background:var(--faint)}.f.L{background:var(--up)}
.sub{color:var(--muted);font-size:12.5px;font-weight:400}
.mk{background:var(--panel2);border-radius:10px;padding:9px 10px;display:grid;grid-template-columns:52px minmax(0,1fr) 88px;gap:8px;align-items:center}
.mk .k{color:var(--muted);font-size:13px}
.mk .v{font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:1px}
.row{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.row .lbl{color:var(--muted);font-size:13px;min-width:52px}
.x3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.x3 div{white-space:nowrap}
.x3 .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.arrow{color:var(--faint);margin:0 4px}
.up{color:var(--up)}.down{color:var(--down)}
.spark{width:88px;height:28px}
.flags{display:flex;flex-direction:column;gap:5px}
.flag{overflow-wrap:anywhere;font-size:14px;line-height:1.5;padding:8px 11px;border-radius:9px;background:color-mix(in srgb,var(--warn) 10%,transparent);border-left:3px solid var(--warn)}
.flag.l0,.flag.l1{border-left-color:var(--faint);background:transparent;color:var(--muted)}
.flag.l3{background:color-mix(in srgb,var(--up) 14%,transparent);border-left-color:var(--up)}
.en{display:block;font-size:12px;font-weight:400;color:var(--faint);line-height:1.2}
.en.il{display:inline;margin-left:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:3px 4px;text-align:center}
.tbl th{color:var(--faint);font-weight:400}
.tbl td:first-child,.tbl th:first-child{text-align:left;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px;list-style:none}
details summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
.last{font-size:13.5px;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.last b{color:var(--text)}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.note{color:var(--faint);font-size:13px;margin-top:30px;line-height:1.7}
.books{font-size:11px;color:var(--faint)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:16px 0}
.panel h2{font-size:17px;margin:0 0 4px}.panel p{color:var(--muted);font-size:14px}.panel h3{font-size:15px;margin:16px 0 6px;color:var(--muted);font-weight:500}
.rec{display:block;font-size:13px;color:var(--faint);margin-top:2px}
#ideasPanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:16px 0}
#ideasPanel h2{font-size:17px;margin:0 0 4px}#ideasPanel h3{font-size:15px;margin:16px 0 6px;color:var(--muted);font-weight:500}#ideasPanel p{color:var(--muted);font-size:14px}
#hist{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:16px 0}
#hist h2{font-size:17px;margin:0 0 4px}
#hist h3{font-size:15px;margin:18px 0 6px;color:var(--muted);font-weight:500}
#hist p{color:var(--muted);font-size:14px;margin:4px 0 10px;line-height:1.7}
.ht{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ht th{color:var(--faint);font-weight:400;text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}
.ht td{text-align:right;padding:5px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.ht td:first-child,.ht th:first-child{text-align:left}
.pos{color:var(--good)}.neg{color:var(--up)}
.scroll{overflow-x:auto}
.card{cursor:pointer}
.card:hover{border-color:color-mix(in srgb,var(--text) 25%,var(--line))}
#dlg{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 55%,transparent);display:none;overflow-y:auto;padding:24px 16px}
#dlg.on{display:block}
#dlg .box{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 24px}
#dlg .x{float:right;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer}
#dlg h2{font-size:20px;margin:4px 0 2px}
#dlg h3{font-size:16px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
#dlg .hint{color:var(--muted);font-size:14px;margin:2px 0 8px;line-height:1.6}
.kv{display:flex;gap:10px 18px;flex-wrap:wrap;font-size:14.5px;margin:6px 0}
.kv b{font-size:16px}
.big .spark,#dlg .spk .spark{width:100%;height:64px}
.mk.big{grid-template-columns:52px minmax(0,1fr)}
.mk.big .spk{grid-column:1/-1}
.btn{display:inline-block;background:var(--warn);color:#14110a;border-radius:10px;padding:10px 16px;font-weight:600;text-decoration:none;font-size:15px}
.idea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.idea .st{float:right;font-size:13px}
.judge td:nth-child(n+2){text-align:right}
@media (max-width:420px){.grid{grid-template-columns:1fr}.mk{grid-template-columns:46px minmax(0,1fr) 64px}.spark{width:64px}.row .lbl{min-width:44px}}
.dmeta{color:var(--muted);font-size:13.5px;margin-top:2px;padding-right:70px}
.dteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0 14px;font-size:21px;font-weight:700;line-height:1.25}
.dteams .a{text-align:right}.dteams .en{font-size:12.5px;margin-top:3px}
.nav{margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.navrow{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;width:100%;padding:14px 14px;background:transparent;border:0;border-top:1px solid var(--line);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.navrow:first-child{border-top:0}.navrow:hover{background:var(--panel2)}
.nt{font-weight:650;font-size:15.5px}.ns{color:var(--muted);font-size:14px;overflow-wrap:anywhere}.na{color:var(--faint);font-size:22px;line-height:1}
.back{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 14px;font:inherit;font-size:14.5px;cursor:pointer;margin-bottom:10px}
#dlg h2.sech{font-size:22px;margin:4px 0 14px}
.kh{color:var(--muted);font-size:14px;margin:14px 0 4px}
@media (max-width:420px){.card .spark{width:52px}}
@media (max-width:560px){.navrow{grid-template-columns:1fr auto}.navrow .ns{grid-column:1;grid-row:2}.navrow .na{grid-row:1/3}.dteams{font-size:18px}}
.moref{color:var(--muted);font-size:13.5px;padding:2px 4px}
.chart{width:100%;height:auto;display:block;margin:4px 0 6px}
.chart .cg{stroke:var(--line);stroke-width:1}.chart .ck{stroke:var(--faint);stroke-dasharray:4 4}
.chart .ct{fill:var(--muted);font-size:12px}.chart .cm{fill:var(--text);font-size:12px;font-weight:600}.chart .cv{font-size:14px;font-weight:700}
.chead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin:18px 0 2px;font-size:15px}.chead span{color:var(--muted);font-size:14px}
.lgc{white-space:nowrap;color:var(--muted)}
.scroll .ht{min-width:620px}.scroll .ht td,.scroll .ht th{white-space:nowrap}
.subkv{margin-left:10px;padding:4px 0 4px 10px;border-left:2px solid var(--line,#444);font-size:.95em}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>赛前盘口看板<span id="gen"></span></h1>
    <div class="stats" id="stats"></div>
  </div>
  <div class="bar">
    <input id="q" placeholder="搜索球队或联赛">
    <select id="lg"><option value="">全部联赛</option></select>
    <span class="chip" id="onlyFlags">只看有信号</span>
    <span class="chip" id="sortScore">按信号强度排序</span>
    <span class="chip" id="histTab">历史规律</span>
    <span class="chip" id="trackTab">信号战绩</span>
    <span class="chip" id="ideasTab">思路战绩</span>
  </div>
</div></header>
<div id="dlg"><div class="box" id="dlgBox"></div></div>
<main class="wrap"><div id="hist" hidden></div><div id="trackPanel" class="panel" hidden></div><div id="ideasPanel" hidden></div><div id="list"><div class="empty">加载中…</div></div>
<div class="note">数据：OddsPapi 盘口（Pinnacle 为参考）、ESPN 赛果、football-data 历史。每小时更新。只提供信息，不是投注建议。</div></main>
<script>
const $=s=>document.querySelector(s);
let ZH={};
const zn=x=>ZH[x]||x;
const zb=x=>ZH[x]?`${esc(ZH[x])}<span class="en">${esc(x)}</span>`:esc(x);
const zi=x=>ZH[x]?`${esc(ZH[x])}<span class="en il">${esc(x)}</span>`:esc(x);
let DATA=null,onlyFlags=false,sortScore=false;
const fmtT=t=>new Date(t*1000).toLocaleString("zh-CN", {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
const dayKey=t=>new Date(t*1000).toLocaleDateString("zh-CN", {month:"long",day:"numeric",weekday:"short"});
const pct=p=>(p*100).toFixed(0)+"%";
const sgn=x=>(x>0?"+":"")+x;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function spark(series,color){
  const pts=(series||[]).filter(p=>p[1]!=null); if(pts.length<2) return "";
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const W=88,H=28,pad=3,sx=x=>pad+(W-2*pad)*(x1===x0?0.5:(x-x0)/(x1-x0)),sy=y=>H-pad-(H-2*pad)*(y1===y0?0.5:(y-y0)/(y1-y0));
  const d=pts.map((p,i)=>(i?"L":"M")+sx(p[0]).toFixed(1)+" "+sy(p[1]).toFixed(1)).join(" ");
  const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/><circle cx="${sx(l[0])}" cy="${sy(l[1])}" r="2.4" fill="${color}"/></svg>`;
}
function dirCls(d,eps){return Math.abs(d)<eps?"":(d>0?"up":"down")}
function mv(a,b,fmt,eps){return `${fmt(a)}<span class="arrow">→</span><b class="${dirCls(b-a,eps)}">${fmt(b)}</b>`}
function mkOU(m){
  if(!m) return "";
  const o=m.open,n=m.now,f2=x=>x.toFixed(2),ln=x=>String(x);
  const lam=(o.lam&&n.lam)?`<div class="row"><span class="lbl">预期进球</span>${mv(o.lam,n.lam,f2,0.05)}</div>`:"";
  return `<div class="mk"><div class="k">大小球</div><div class="v"><div class="row"><span class="lbl">盘口</span>${ln(o.line)}<span class="arrow">→</span><b>${ln(n.line)}</b></div>${lam}<div class="sub">大 ${n.odds[0].toFixed(2)} / 小 ${n.odds[1].toFixed(2)} · 变盘 ${m.changes} 次</div></div>${spark(m.series,"var(--up)")}</div>`;
}
const AHN={0:"平手",0.25:"平半",0.5:"半球",0.75:"半一",1:"一球",1.25:"一球/球半",1.5:"球半",1.75:"球半/两球",2:"两球",2.25:"两球/两球半",2.5:"两球半",2.75:"两球半/三球",3:"三球"};
function ahLine(x){if(x===0)return "平手";const n=AHN[Math.abs(x)]||Math.abs(x)+"球";return (x<0?"让":"受让")+n}
function mkAH(m){
  if(!m) return "";
  const o=m.open,n=m.now,sg=x=>sgn(x.toFixed(2));
  return `<div class="mk"><div class="k">亚盘</div><div class="v"><div class="row"><span class="lbl">主队</span>${ahLine(o.line)}<span class="arrow">→</span><b>${ahLine(n.line)}</b></div><div class="row"><span class="lbl">净胜球</span>${mv(o.sup,n.sup,sg,0.05)}</div><div class="sub">主 ${n.odds[0].toFixed(2)} / 客 ${n.odds[1].toFixed(2)}</div></div>${spark(m.series,"var(--home)")}</div>`;
}
function mk12(m){
  if(!m) return "";
  const o=m.open.p,n=m.now.p,lab=["主胜","平局","客胜"];
  const rows=n.map((p,i)=>`<div class="row"><span class="lbl">${lab[i]}</span>${mv(o[i],p,pct,0.015)}<span class="sub">　${m.now.odds[i].toFixed(2)}</span></div>`).join("");
  return `<div class="mk"><div class="k">胜平负</div><div class="v">${rows}</div>${spark(m.series,"var(--good)")}</div>`;
}
function formBoxes(s){return s&&s.form?`<div class="form">${[...s.form].map(c=>`<span class="f ${c}">${c==="W"?"胜":c==="D"?"平":"负"}</span>`).join("")}</div>`:""}
function statRow(lbl,h,a,f){return `<tr><td>${lbl}</td><td>${h&&h.n?f(h):"—"}</td><td>${a&&a.n?f(a):"—"}</td></tr>`}
function statsBlock(fx){
  const h=fx.stats.home,a=fx.stats.away;
  if(!(h.all&&h.all.n)&&!(a.all&&a.all.n)) return `<div class="sub">暂无球队近况（ESPN 没有这两队的数据）</div>`;
  const last=s=>s&&s.last?s.last.map(m=>`<div>${m.ha==="主"?"主":"客"} vs ${esc(m.opp)} <b>${m.score}</b></div>`).join(""):"<div>—</div>";
  return `<details><summary>球队近况（近 10 场 / ${fx.home} 主场、${fx.away} 客场近 8 场）${fx.exp_total?`　基本面推算 ${fx.exp_total} 球`:""}</summary>
  <table class="tbl"><tr><th></th><th>${zi(fx.home)}</th><th>${zi(fx.away)}</th></tr>
  ${statRow("场均进/失",h.all,a.all,s=>`${s.gf} / ${s.ga}`)}
  ${statRow("主/客场进/失",h.venue,a.venue,s=>`${s.gf} / ${s.ga}`)}
  ${statRow("大 2.5",h.all,a.all,s=>pct(s.o25))}
  ${statRow("双方进球",h.all,a.all,s=>pct(s.btts))}
  ${statRow("零封",h.all,a.all,s=>pct(s.cs))}</table>
  <div class="last"><div><div class="sub">${zi(fx.home)} 最近 5 场</div>${last(h.all)}</div><div><div class="sub">${zi(fx.away)} 最近 5 场</div>${last(a.all)}</div></div></details>`;
}
function cardHTML(fx){
  const ref=fx.books.pinnacle||Object.values(fx.books)[0];
  const bk=Object.keys(fx.books);
  const flags=topFlags(fx,3);
  return `<div class="card ${fx.score>=3?"hot":""}" data-id="${esc(fx.id)}">
   <div class="meta"><span class="lg">${fx.country?zi(fx.country)+" · ":""}${esc(fx.league)}</span><span>${fmtT(fx.start)}</span></div>
   <div class="teams"><div class="tm">${zb(fx.home)}${formBoxes(fx.stats.home.all)}</div><div class="vs">VS</div><div class="tm a">${zb(fx.away)}${formBoxes(fx.stats.away.all)}</div></div>
   ${ref?mkOU(ref.ou)+mkAH(ref.ah)+mk12(ref["1x2"]):`<div class="sub">暂无盘口数据</div>`}
   ${flags}
   ${statsBlock(fx)}
  </div>`;
}
function render(){
  if(!DATA) return;
  const q=$("#q").value.trim().toLowerCase(),lg=$("#lg").value;
  let xs=DATA.fixtures.filter(f=>(!lg||f.league===lg)&&(!onlyFlags||f.flags.length)&&(!q||(f.home+f.away+zn(f.home)+zn(f.away)+f.league+f.country+zn(f.country)).toLowerCase().includes(q)));
  if(!xs.length){$("#list").innerHTML=`<div class="empty">没有符合条件的比赛</div>`;return}
  if(sortScore){xs=[...xs].sort((a,b)=>b.score-a.score||a.start-b.start);$("#list").innerHTML=`<div class="grid">${xs.map(cardHTML).join("")}</div>`;return}
  const groups={};xs.forEach(f=>(groups[dayKey(f.start)]??=[]).push(f));
  $("#list").innerHTML=Object.entries(groups).map(([d,fs])=>`<div class="day">${d} · ${fs.length} 场</div><div class="grid">${fs.map(cardHTML).join("")}</div>`).join("");
}
function init(d){
  DATA=d;
  $("#gen").textContent="更新于 "+fmtT(d.generated);
  const s=d.summary;
  const ORDER={};(d.leagues||[]).forEach((x,i)=>ORDER[x.league]=i);
  $("#stats").innerHTML=`<span><b>${s.fixtures}</b>场比赛</span><span><b>${s.with_odds}</b>有盘口</span><span><b>${s.flags}</b>有信号</span>`;
  const lgs={};d.fixtures.forEach(f=>lgs[f.league]=(lgs[f.league]||0)+1);
  $("#lg").innerHTML=`<option value="">全部联赛（${d.fixtures.length}）</option>`+Object.entries(lgs).sort((a,b)=>((ORDER[a[0]]??99)-(ORDER[b[0]]??99))||b[1]-a[1]).map(([l,n])=>`<option value="${esc(l)}">${esc(l)}（${n}）</option>`).join("");
  render();
  if(location.hash.length>1){const [hid,hk]=decodeURIComponent(location.hash.slice(1)).split("/");openDlg(hid);if(hk)openSec(hid,hk)}
}
function histTable(g,kind){
  const keys=Object.keys(g||{}).filter(k=>g[k].n>=5&&g[k].k!==0).sort((a,b)=>(g[a].k-g[b].k)||(g[a].from-g[b].from));
  if(!keys.length) return `<p>还没有足够的历史比赛。</p>`;

  ["chart","盘口走势",fx=>{const r=fx.books.pinnacle||Object.values(fx.books)[0];return r&&r.ou?`大小球变盘 ${r.ou.changes} 次`:"Pinnacle 开盘 → 现在"},secChart],
  ["signals","信号与战绩",fx=>fx.flags.length?`${fx.flags.length} 条信号，每类的历史回报`:"没有信号",secSignals],
  ["judge","判断",fx=>{const j=((fx.detail||{}).judge||[]).filter(x=>x.n>=30).sort((a,b)=>Math.abs(b.edge)-Math.abs(a.edge))[0];return j?`偏差最大：${j.what} ${j.edge>0?"+":""}${(j.edge*100).toFixed(1)}%（置信度${j.conf}）`:"样本不足 30 场，参考价值低"},secJudge],
  ["move","历史同升降",fx=>{const m=((fx.detail||{}).same_move)||{};const a=m.ah,o=m.ou;const t=[];
    if(a&&a.from!==a.to)t.push(`亚盘 ${ahN(a.from)}→${ahN(a.to)} 同联赛 ${a.n} 场${a.n?" · 主队赢盘 "+pc0(a.home_cover):""}`);
    if(o&&o.from!==o.to)t.push(`大小 ${o.from}→${o.to} 同联赛 ${o.n} 场${o.n?" · 大球 "+pc0(o.over):""}`);
    return t.join("；")||"盘口没变"},secMove],
  ["odds","历史同赔",fx=>{const l=(((fx.detail||{}).same_odds)||{}).league;return l&&l.n?`同联赛 ${l.n} 场：主胜 ${pc0(l.w/l.n)} · 平 ${pc0(l.d/l.n)} · 客胜 ${pc0(l.l/l.n)}`:"没有找到同赔比赛"},secOdds],
  ["h2h","历史交手",fx=>{const x=(fx.detail||{}).h2h;return x&&x.n?`${x.n} 场：${zn(fx.home)} ${x.w} 胜 ${x.d} 平 ${x.l} 负 · 场均 ${x.avg_goals} 球`:"没有交手记录"},secH2H],
  ["form","球队近况",fx=>fx.exp_total?`基本面推算本场 ${fx.exp_total.toFixed(2)} 球`:"近 10 场战绩",secForm],
  ["ideas","思路",fx=>{const n=(IDEAS&&IDEAS.ideas||[]).filter(i=>i.match===fx.id).length,sy=(LEARN&&LEARN.sys||[]).filter(s=>s.match===fx.id);
    const t=[];if(sy.length)t.push("系统思路："+sy.map(s=>s.market+" "+s.pick).join("、"));t.push(n?`你有 ${n} 条思路`:"提交你的思路，对的会被系统学走");return t.join(" · ")},secIdeas],
];
function detailHTML(fx){
  const ref=fx.books.pinnacle||Object.values(fx.books)[0];
  let h=`<button class="x" onclick="closeDlg()">关闭</button><div class="dmeta">${fx.country?zi(fx.country)+" · ":""}${esc(fx.league)} · ${fmtT(fx.start)}</div>
  <div class="dteams"><div>${zb(fx.home)}</div><span class="vs">VS</span><div class="a">${zb(fx.away)}</div></div>`;
  h+=ref?[mkOU(ref.ou),mkAH(ref.ah),mk12(ref["1x2"])].map(x=>x.replace('<div class="mk">','<div class="mk big">').replace(/<svg class="spark"[\s\S]*?<\/svg>/,"")).join(""):`<div class="hint">暂无盘口数据</div>`;
  h+=`<div style="margin-top:12px">${topFlags(fx,3)}</div>`;
  h+=`<div class="nav">${SECS.map(([k,t,sum])=>`<button class="navrow" onclick="openSec('${esc(fx.id)}','${k}')"><span class="nt">${t}</span><span class="ns">${esc(sum(fx))}</span><span class="na">›</span></button>`).join("")}</div>`;
  return h;
}
function openSec(id,key){
  const fx=DATA.fixtures.find(f=>f.id===id),sec=SECS.find(x=>x[0]===key);if(!fx||!sec)return;
  $("#dlgBox").innerHTML=`<button class="back" onclick="openDlg('${esc(id)}')">‹ 返回</button><button class="x" onclick="closeDlg()">关闭</button>
  <div class="dmeta">${zn(fx.home)} vs ${zn(fx.away)}</div><h2 class="sech">${sec[1]}</h2>${sec[3](fx)}`;
  $("#dlgBox").scrollTop=0;$("#dlg").scrollTop=0;
  history.replaceState(null,"","#"+encodeURIComponent(id)+"/"+key);
}
function openDlg(id){const fx=DATA.fixtures.find(f=>f.id===id);if(!fx)return;$("#dlgBox").innerHTML=detailHTML(fx);$("#dlg").classList.add("on");document.body.style.overflow="hidden";history.replaceState(null,"","#"+encodeURIComponent(id))}
function closeDlg(){$("#dlg").classList.remove("on");document.body.style.overflow="";history.replaceState(null,"",location.pathname)}
$("#dlg").onclick=e=>{if(e.target.id==="dlg")closeDlg()};
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;const b=document.querySelector("#dlgBox .back");b?b.click():closeDlg()});
$("#list").addEventListener("click",e=>{if(e.target.closest("details,a"))return;const c=e.target.closest(".card");if(c)openDlg(c.dataset.id)});
function learnHTML(){
  const L=LEARN;if(!L)return"";
  const rec=r=>r&&r.n?`${r.n} 次，赢 ${r.win}，每注 ${R(r.roi)}`:"还没有已结算的";
  const st=s=>s==="使用中"?`<span class="pos">使用中</span>`:`<span class="neg">${esc(s)}</span>`;
  return `<h3>你 vs 系统</h3><div class="kv"><span>你：<b>${rec(L.rec.user)}</b></span><span>系统：<b>${rec(L.rec.sys)}</b></span></div>
  <h3>系统学到的规律（来自你做对的思路）</h3>${L.patterns.length?`<div class="scroll"><table class="ht"><tr><th>局面 → 怎么买</th><th>学自</th><th>历史回测</th><th>实战</th><th>状态</th></tr>${L.patterns.map(p=>`<tr><td>${esc(p.desc)}</td><td>${p.from.map(f=>`<a href="${f.url||"#"}" target="_blank" rel="noopener">${esc(f.game_zh||f.game)}</a>`).join("<br>")}</td><td>${p.bt.n?`${p.bt.n} 场 ${R(p.bt.roi)}`:"无同样局面"}</td><td>${p.live.n?`${p.live.n} 次 ${R(p.live.roi)}`:"—"}</td><td>${st(p.status)}</td></tr>`).join("")}</table></div>`:`<p>还没有。你的思路做对一次，系统就会把当时的局面记成一条规律，以后遇到同样局面自己出思路；实战连续亏或历史回测亏的规律会自动停用。</p>`}`;
}
function renderIdeas(x){
  IDEAS=x;
  const rec=r=>r&&r.n?`${r.n} 次 · 赢 ${r.win} · 回报 ${R(r.roi)}`:"还没有已结算的思路";
  $("#ideasPanel").innerHTML=`<h2>思路战绩</h2><p>只统计开赛前提交、已出结果的思路。回报按提交时的赔率、亚洲盘结算，每次 1 元。样本少时看个大概，几十次以上才有参考意义。</p>
  <div class="kv"><span>全部：<b>${rec(x&&x.all)}</b></span></div>
  <h3>按玩法</h3><div class="kv">${Object.entries((x&&x.market)||{}).map(([k,v])=>`<span>${k}：${rec(v)}</span>`).join("")}</div>
  <h3>按理由（哪类思路长期靠谱）</h3>${x&&Object.keys(x.tags||{}).length?`<table class="ht"><tr><th>理由</th><th>次数</th><th>赢</th><th>走水</th><th>回报</th></tr>${Object.entries(x.tags).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.win}</td><td>${v.push}</td><td>${R(v.roi)}</td></tr>`).join("")}</table>`:"<p>还没有数据。点开任意比赛，用「提交思路」开始记录。</p>"}${learnHTML()}`;
}
$("#trackTab").onclick=e=>{const on=$("#trackPanel").hidden;$("#trackPanel").hidden=!on;e.target.classList.toggle("on",on)};
fetch("track.json?"+Date.now()).then(r=>r.json()).then(renderTrack).catch(()=>renderTrack(null));
$("#ideasTab").onclick=e=>{const on=$("#ideasPanel").hidden;$("#ideasPanel").hidden=!on;e.target.classList.toggle("on",on)};
fetch("learn.json?"+Date.now()).then(r=>r.json()).then(x=>LEARN=x).catch(()=>{}).then(()=>fetch("ideas.json?"+Date.now())).then(r=>r.json()).then(renderIdeas).catch(()=>renderIdeas(null));
$("#histTab").onclick=e=>{const on=$("#hist").hidden;$("#hist").hidden=!on;e.target.classList.toggle("on",on)};
fetch("history.json?"+Date.now()).then(r=>r.json()).then(renderHist).catch(()=>renderHist(null));
$("#q").oninput=render;$("#lg").onchange=render;
$("#onlyFlags").onclick=e=>{onlyFlags=!onlyFlags;e.target.classList.toggle("on",onlyFlags);render()};
$("#sortScore").onclick=e=>{sortScore=!sortScore;e.target.classList.toggle("on",sortScore);render()};
fetch("zh.json?"+Date.now()).then(r=>r.json()).then(z=>ZH=z).catch(()=>{}).then(()=>fetch("data.json?"+Date.now())).then(r=>r.json()).then(init).catch(()=>$("#list").innerHTML=`<div class="empty">还没有数据：第一次自动运行完成后这里会显示比赛。</div>`);
</script>
</body>
</html>
